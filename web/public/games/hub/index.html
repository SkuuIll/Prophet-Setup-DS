<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prophet Games</title>
    <link rel="stylesheet" href="/games/common/theme.css?v=20260811h">
    <link rel="stylesheet" href="/games/hub/hub.css?v=20260811h">
    <style>
      #activity-boot {
        position: fixed; inset: 0; z-index: 99990;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #07050f; color: #e8e0ff; font-family: system-ui, sans-serif; gap: 10px;
      }
      #activity-boot.hidden { display: none; }
      #activity-boot .spin {
        width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid rgba(179,136,255,.25); border-top-color: #b388ff;
        animation: abspin .75s linear infinite;
      }
      @keyframes abspin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="hub-body">
    <div id="activity-boot">
        <div class="spin"></div>
        <div style="font-weight:800;letter-spacing:.5px;font-size:.95rem">Prophet Games</div>
        <div id="activity-boot-msg" style="color:#a89bc4;font-size:.82rem">Conectando…</div>
    </div>
    <script>
      window.__hideActivityBoot = function (msg) {
        var el = document.getElementById('activity-boot');
        if (!el) return;
        if (msg) {
          var m = document.getElementById('activity-boot-msg');
          if (m) m.textContent = msg;
        } else {
          el.classList.add('hidden');
        }
      };
      setTimeout(function () {
        var el = document.getElementById('activity-boot');
        if (el && !el.classList.contains('hidden')) el.classList.add('hidden');
      }, 10000);
    </script>

    <div class="hub-orbs" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
    </div>

    <!-- Top bar compacta -->
    <header class="hub-topbar">
        <div class="hub-brand">
            <div class="hub-logo" style="background-image:url('/assets/logo.png')"></div>
            <div class="hub-brand-text">
                <strong>Prophet</strong>
                <span>Games</span>
            </div>
        </div>
        <div class="hub-user" id="hub-user">
            <img id="user-avatar" class="hub-avatar" alt="" width="32" height="32" hidden>
            <div class="hub-user-meta">
                <span id="user-name" class="hub-uname">…</span>
                <span id="user-level" class="hub-ulevel">Nvl —</span>
            </div>
            <div class="hub-coins" title="Monedas">
                <span class="hub-coin-ico">◈</span>
                <span id="user-balance">—</span>
            </div>
        </div>
    </header>

    <main class="hub-main">
        <!-- Greeting strip (sin números enormes) -->
        <section class="hub-welcome">
            <div class="welcome-left">
                <p class="welcome-hi" id="hero-greeting">Bienvenido</p>
                <h1 class="welcome-title">¿A qué jugamos?</h1>
            </div>
            <div class="welcome-right">
                <span class="status-pill" id="conn-status">Conectando…</span>
            </div>
        </section>

        <!-- Games as compact tiles -->
        <section class="hub-games" aria-label="Juegos">
            <a class="g-tile t-tycoon" data-href="/games/tycoon/" href="/games/tycoon/">
                <span class="g-ico">◆</span>
                <span class="g-body">
                    <span class="g-name">Tycoon</span>
                    <span class="g-tag">Idle · servers</span>
                </span>
                <span class="g-go">→</span>
            </a>

            <a class="g-tile t-casino" data-href="/games/casino/" href="/games/casino/">
                <span class="g-ico">◈</span>
                <span class="g-body">
                    <span class="g-name">Casino</span>
                    <span class="g-tag">Crash · Ruleta · Cajas</span>
                </span>
                <span class="g-go">→</span>
            </a>

            <a class="g-tile t-cards" data-href="/games/cards/" href="/games/cards/">
                <span class="g-ico">♠</span>
                <span class="g-body">
                    <span class="g-name">Cartas</span>
                    <span class="g-tag">Truco · UNO · BJ</span>
                </span>
                <span class="g-go">→</span>
            </a>

            <a class="g-tile t-trivia" data-href="/games/trivia/" href="/games/trivia/">
                <span class="g-ico">★</span>
                <span class="g-body">
                    <span class="g-name">Trivia</span>
                    <span class="g-tag">Party en vivo</span>
                </span>
                <span class="g-go">→</span>
            </a>

            <a class="g-tile t-survivor featured" data-href="/games/survivor/" href="/games/survivor/">
                <span class="g-ico">◎</span>
                <span class="g-body">
                    <span class="g-name">Survivor</span>
                    <span class="g-tag">Arcade · oleadas · bosses</span>
                </span>
                <span class="g-chip">HOT</span>
                <span class="g-go">→</span>
            </a>
        </section>

        <p class="hub-hint">Monedas virtuales del server · sin dinero real</p>
    </main>

    <script type="module" src="/games/common/discordActivity.js?v=20260811h"></script>
    <script src="/games/common/utils.js?v=20260811h"></script>
    <script src="/games/common/profileUI.js?v=20260811h"></script>
    <script src="/games/common/api.js?v=20260811h"></script>
    <script src="/games/hub/hub.js?v=20260811h"></script>
</body>
</html>
