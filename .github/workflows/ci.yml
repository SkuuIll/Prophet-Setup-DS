name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Evita rate-limit de GitHub API al descargar yt-dlp en runners compartidos.
      # Las pruebas no requieren el ejecutable; el despliegue del VPS sí lo instala.
      - run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
      - run: bash -n scripts/deploy.sh scripts/auto_update.sh
      - run: npm run verify
      - run: npm run audit:prod
